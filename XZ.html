<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>给女朋友的立冬祝福</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(135deg, #f5fafe 0%, #eaf6fa 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            padding: 20px;
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23e3f2fd' fill-opacity='0.3' fill-rule='evenodd'/%3E%3C/svg%3E");
        }
        .card {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 10px 30px rgba(144, 202, 249, 0.15);
            border: 1px solid rgba(186, 230, 253, 0.4);
            text-align: center;
            transition: all 0.5s ease;
        }
        /* 初始提示卡片样式 */
        .start-card {
            display: block;
        }
        /* 立冬祝福卡片样式 */
        .blessing-card {
            display: none;
        }
        .card-title {
            font-size: 22px;
            font-weight: 600;
            color: #2d7dcc;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        .card-content {
            font-size: 28px;
            font-weight: 700;
            color: #1a5fb4;
            line-height: 1.5;
            margin-bottom: 40px;
            text-shadow: 0 2px 4px rgba(144, 202, 249, 0.3);
        }
        .receive-btn {
            background: linear-gradient(135deg, #4299e1 0%, #38b2ac 100%);
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(66, 153, 225, 0.3);
        }
        .receive-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(66, 153, 225, 0.4);
            background: linear-gradient(135deg, #3182ce 0%, #319795 100%);
        }
        .blessing-title {
            font-size: 24px;
            font-weight: 600;
            color: #4299e1;
            margin-bottom: 25px;
            position: relative;
            display: inline-block;
        }
        .blessing-title::after {
            content: "❄️";
            position: absolute;
            top: -5px;
            right: -25px;
        }
        .blessing-title::before {
            content: "❄️";
            position: absolute;
            top: -5px;
            left: -25px;
        }
        .blessing-content {
            font-size: 18px;
            color: #2d3748;
            line-height: 2;
            margin-bottom: 30px;
        }
        .blessing-quote {
            color: #4a5568;
            font-size: 17px;
            padding: 12px 20px;
            background-color: rgba(234, 246, 250, 0.6);
            border-radius: 12px;
            display: inline-block;
        }
        .snowflake {
            position: absolute;
            opacity: 0.7;
            animation: snow 5s linear infinite;
            z-index: -1;
        }
        @keyframes snow {
            0% {
                transform: translateY(-10px) rotate(0deg);
                opacity: 0;
            }
            50% {
                opacity: 1;
            }
            100% {
                transform: translateY(100vh) rotate(360deg);
                opacity: 0;
            }
        }
        /* 响应式调整 */
        @media (max-width: 480px) {
            .card {
                padding: 30px 20px;
            }
            .card-content {
                font-size: 24px;
            }
            .receive-btn {
                padding: 10px 25px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <!-- 动态雪花 -->
    <script>
        for (let i = 0; i < 15; i++) {
            const snowflake = document.createElement('div');
            snowflake.className = 'snowflake';
            snowflake.style.left = Math.random() * 100 + 'vw';
            snowflake.style.top = Math.random() * -50 + 'vh';
            snowflake.style.fontSize = Math.random() * 15 + 10 + 'px';
            snowflake.innerHTML = '❄️';
            snowflake.style.animationDelay = Math.random() * 5 + 's';
            document.body.appendChild(snowflake);
        }
    </script>

    <!-- 初始提示卡片 -->
    <div class="card start-card" id="startCard">
        <h3 class="card-title">专属祝福</h3>
        <div class="card-content">小郑天天开心</div>
        <button class="receive-btn" id="receiveBtn">收到</button>
    </div>

    <!-- 立冬祝福卡片（默认隐藏） -->
    <div class="card blessing-card" id="blessingCard">
        <h2 class="blessing-title">立冬快乐呀豆豆姐</h2>
        <p class="blessing-content">
            立冬啦，天气越来越冷啦<br>
            以后穿厚一点，不要再感冒啦<br>
            要开开心心快快乐乐的过每一天<br>
             不要被小孩子气到了<br>
            每天都是快乐的土豆<br>
            过一个温暖的冬天
        </p >
        <span class="blessing-quote">——愿你以后幸福常伴左右，世界温暖如春</span>
    </div>

    <script>
        // 点击“收到”切换卡片
        const receiveBtn = document.getElementById('receiveBtn');
        const startCard = document.getElementById('startCard');
        const blessingCard = document.getElementById('blessingCard');

        receiveBtn.addEventListener('click', function() {
            startCard.style.display = 'none';
            blessingCard.style.display = 'block';
        });
    </script>
</body>
</html>
