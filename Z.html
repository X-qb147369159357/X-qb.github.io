<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>暖心祝福</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            /* 柔和渐变背景，呼应立冬主题又不抢戏 */
            background: linear-gradient(120deg, #f0f8ff 0%, #e8f4f8 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            padding: 20px;
            /* 轻微纹理增加质感 */
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M11 18c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm48 25c3.866 0 7-3.134 7-7s-3.134-7-7-7-7 3.134-7 7 3.134 7 7 7zm-43-7c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm63 31c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM34 90c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zm56-76c1.657 0 3-1.343 3-3s-1.343-3-3-3-3 1.343-3 3 1.343 3 3 3zM12 86c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm28-65c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm23-11c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-6 60c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm29 22c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zM32 63c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm57-13c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm-9-21c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM60 91c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM35 41c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2zM12 60c1.105 0 2-.895 2-2s-.895-2-2-2-2 .895-2 2 .895 2 2 2z' fill='%23cfe8f3' fill-opacity='0.3' fill-rule='evenodd'/%3E%3C/svg%3E");
        }
        .blessing-card {
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 450px;
            /* 精致阴影提升层次感 */
            box-shadow: 0 10px 30px rgba(144, 202, 249, 0.2);
            border: 1px solid rgba(186, 230, 253, 0.5);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        /* 角落装饰元素 */
        .blessing-card::before {
            content: "❄️";
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 20px;
            opacity: 0.6;
        }
        .blessing-card::after {
            content: "🍂";
            position: absolute;
            bottom: 15px;
            right: 15px;
            font-size: 20px;
            opacity: 0.6;
        }
        .card-title {
            font-size: 22px;
            font-weight: 600;
            color: #2d7dcc;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }
        .card-content {
            font-size: 28px;
            font-weight: 700;
            color: #1a5fb4;
            line-height: 1.5;
            margin-bottom: 40px;
            text-shadow: 0 2px 4px rgba(144, 202, 249, 0.3);
        }
        .receive-btn {
            background: linear-gradient(135deg, #4299e1 0%, #38b2ac 100%);
            color: #fff;
            border: none;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 18px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(66, 153, 225, 0.3);
        }
        .receive-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(66, 153, 225, 0.4);
            background: linear-gradient(135deg, #3182ce 0%, #319795 100%);
        }
        /* 响应式调整 */
        @media (max-width: 480px) {
            .blessing-card {
                padding: 30px 20px;
            }
            .card-content {
                font-size: 24px;
            }
            .receive-btn {
                padding: 10px 25px;
                font-size: 16px;
            }
        }
    </style>
</head>
<body>
    <div class="blessing-card">
        <h3 class="card-title">小徐的祝福</h3>
        <div class="card-content">小郑天天开心</div>
        <button class="receive-btn" id="receiveBtn">收到</button>
    </div>

    <script>
        const receiveBtn = document.getElementById('receiveBtn');
        receiveBtn.addEventListener('click', function() {
            // 跳转至立冬祝福页（确保两个文件在同一目录）
            window.location.href = 'X.html';
        });
    </script>
</body>
</html>
